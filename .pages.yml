- name: beliefs
  label: 03 — WHAT WE BELIEVE
  type: file
  path: content/beliefs.json
  format: json
  fields:
  - name: intro
    label: Introduction and heading
    type: object
    fields:
    - name: title_first
      label: Heading / line 1
      type: string
    - name: title_second
      label: Heading / outlined line
      type: string
    - name: toc_heading
      label: Table of contents heading
      type: string
    - name: subtitle
      label: Tagline
      type: text
    - name: description
      label: Introductory paragraph
      type: text
  - name: beliefs
    label: The 11 beliefs
    type: object
    fields:
    - name: id
      label: Section anchor — leave unchanged
      type: string
      readonly: true
    - name: title
      label: Article title
      type: string
    - name: home_label
      label: Short homepage card title
      type: string
    - name: menu_label
      label: Short sidebar title
      type: string
    - name: body
      label: Full teaching (rich text)
      type: rich-text
      options:
        format: html
    - name: scriptures
      label: Scripture references
      type: text
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
  - name: foundation
    label: Closing foundation statement
    type: object
    fields:
    - name: heading
      label: Closing headline
      type: string
    - name: paragraph_one
      label: Foundation paragraph
      type: text
    - name: paragraph_two
      label: Closing paragraph
      type: text
    - name: verse
      label: Closing Scripture
      type: text
