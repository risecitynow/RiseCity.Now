# Rise City — EXPANDED Pages CMS config
# Place at repository root as .pages.yml (leading dot required).
# Each field below saves to a real content/*.json property.
# Changes are displayed by cms-content.js included in the matching ZIP.
# Keeping only this YAML but not the matching JS/CSS will leave new design options inactive.
media:
  input: assets
  output: /assets
content:
- name: appearance
  label: 01 • Design Studio — Colors, Hero, Sections & Layout
  type: file
  path: content/appearance.json
  format: json
  fields:
  - name: palette
    label: 01A • Brand palette and base backgrounds
    type: object
    fields:
    - name: page_background
      label: Page background
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: body_text
      label: Main text
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: muted_text
      label: Paragraph / secondary text
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: card_background
      label: Cards / surfaces
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: alternate_background
      label: Alternating section background
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: divider
      label: Borders / dividers
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: header_background
      label: Navigation bar
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: header_text
      label: Navigation text
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: announcement_background
      label: Top announcement background
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: announcement_text
      label: Top announcement text
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: accent
      label: Line / rule accents
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: outline_text
      label: Outlined heading text
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: button_background
      label: Dark button background
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: button_text
      label: Dark button text
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: light_button_background
      label: Light button background
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: light_button_text
      label: Light button text
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: dark_background
      label: Dark section background
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: dark_text
      label: Dark section text
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
    - name: footer_background
      label: Footer background
      type: string
      description: 'Hex color such as #FFFFFF. All colors should include the #. Changes appear when Pages CMS saves
        the JSON.'
  - name: footer_style
    label: 01B • Footer — readable colors, logo & layout
    type: object
    description: Footer controls fix the faded type from your screenshot; auto contrast is safest for light gray
      or white backgrounds.
    fields:
    - name: contrast_mode
      label: Text contrast mode
      type: select
      description: Auto chooses dark text on light backgrounds or white text on dark backgrounds. Custom allows
        text overrides below.
      options:
        values:
        - auto
        - light
        - dark
        - custom
    - name: text_color
      label: Custom footer main text color
      type: string
      description: Used when contrast mode = custom.
      pattern:
        regex: ^$|^#(?:[A-Fa-f0-9]{3}|[A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$
        message: 'Use a hex color such as #FFFFFF, or leave this blank.'
    - name: muted_color
      label: Custom footer small-print color
      type: string
      description: Used when contrast mode = custom.
      pattern:
        regex: ^$|^#(?:[A-Fa-f0-9]{3}|[A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$
        message: 'Use a hex color such as #FFFFFF, or leave this blank.'
    - name: link_color
      label: Custom footer links color
      type: string
      description: Used when contrast mode = custom.
      pattern:
        regex: ^$|^#(?:[A-Fa-f0-9]{3}|[A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$
        message: 'Use a hex color such as #FFFFFF, or leave this blank.'
    - name: divider_color
      label: Custom footer divider line
      type: string
      description: Used when contrast mode = custom.
      pattern:
        regex: ^$|^#(?:[A-Fa-f0-9]{3}|[A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$
        message: 'Use a hex color such as #FFFFFF, or leave this blank.'
    - name: logo_style
      label: Footer logo treatment
      type: select
      description: Auto uses the appropriate logo contrast. Original = black logo; inverted = white logo.
      options:
        values:
        - auto
        - original
        - inverted
    - name: logo_width_desktop
      label: Footer wordmark width — desktop (px)
      type: number
      options:
        min: 90
        max: 600
    - name: logo_width_mobile
      label: Footer wordmark width — mobile (px)
      type: number
      options:
        min: 90
        max: 420
    - name: padding_top_desktop
      label: Footer top space — desktop (px)
      type: number
      options:
        min: 16
        max: 200
    - name: padding_bottom_desktop
      label: Footer bottom space — desktop (px)
      type: number
      options:
        min: 16
        max: 200
    - name: padding_top_mobile
      label: Footer top space — phone (px)
      type: number
      options:
        min: 12
        max: 140
    - name: padding_bottom_mobile
      label: Footer bottom space — phone (px)
      type: number
      options:
        min: 12
        max: 140
    - name: motto_font_size
      label: Footer motto size — desktop (px)
      type: number
      options:
        min: 10
        max: 32
    - name: copyright_font_size
      label: Copyright/footer-link size — desktop (px)
      type: number
      options:
        min: 10
        max: 22
    - name: footer_link_gap
      label: Gap between footer links (px)
      type: number
      options:
        min: 8
        max: 60
    - name: motto_alignment
      label: Footer motto alignment
      type: select
      options:
        values:
        - auto
        - left
        - center
        - right
    - name: show_motto
      label: Show footer motto
      type: boolean
    - name: show_footer_links
      label: Show footer navigation links
      type: boolean
    - name: show_copyright
      label: Show copyright line
      type: boolean
  - name: typography
    label: 02 • Typography, font sizes & spacing
    type: object
    fields:
    - name: headings_font
      label: Headings font
      type: select
      options:
        values:
        - Manrope
        - DM Sans
        - Inter
        - Space Grotesk
        - Arial
        - Georgia
        - Playfair Display
    - name: body_font
      label: Body font
      type: select
      options:
        values:
        - DM Sans
        - Manrope
        - Inter
        - Space Grotesk
        - Arial
        - Georgia
        - Playfair Display
    - name: body_font_size
      label: Body base font (px)
      type: number
      options:
        min: 12
        max: 24
    - name: heading_scale
      label: Heading scale (%)
      type: number
      options:
        min: 65
        max: 150
    - name: body_line_height
      label: Body line height
      type: number
      options:
        min: 1.2
        max: 2.5
    - name: navigation_font_size
      label: Desktop navigation size (px)
      type: number
      options:
        min: 10
        max: 20
    - name: letter_spacing
      label: Headings letter spacing (% of em)
      type: number
      options:
        min: -12
        max: 3
    - name: hero_heading_scale
      label: Hero title size multiplier (%)
      type: number
      options:
        min: 60
        max: 170
    - name: section_heading_scale
      label: Other section title size multiplier (%)
      type: number
      options:
        min: 60
        max: 170
    - name: body_paragraph_size
      label: Body paragraphs (px)
      type: number
      options:
        min: 12
        max: 24
    - name: section_kicker_size
      label: Small uppercase section labels (px)
      type: number
      options:
        min: 8
        max: 18
    - name: button_font_size
      label: Buttons text size (px)
      type: number
      options:
        min: 10
        max: 20
    - name: footer_font_size
      label: Footer text size (px)
      type: number
      options:
        min: 10
        max: 24
    - name: heading_line_height_percent
      label: Headings line height (%)
      type: number
      options:
        min: 80
        max: 150
    - name: nav_letter_spacing_percent
      label: Navigation tracking (% of em)
      type: number
      options:
        min: -5
        max: 15
    - name: button_letter_spacing_percent
      label: Button label tracking (% of em)
      type: number
      options:
        min: -5
        max: 15
    - name: body_font_weight
      label: Body font weight
      type: select
      options:
        values:
        - '400'
        - '500'
        - '600'
        - '700'
    - name: heading_font_weight
      label: Main headings weight
      type: select
      options:
        values:
        - '500'
        - '600'
        - '700'
        - '800'
  - name: layout
    label: 03 • Layout, full-width banner & site behavior
    type: object
    fields:
    - name: content_max_width
      label: Main content width (px)
      type: number
      options:
        min: 860
        max: 1800
    - name: section_padding_desktop
      label: Section vertical padding — desktop (px)
      type: number
      options:
        min: 32
        max: 220
    - name: section_padding_mobile
      label: Section vertical padding — mobile (px)
      type: number
      options:
        min: 24
        max: 150
    - name: button_corner_radius
      label: Button rounding (px)
      type: number
      options:
        min: 0
        max: 50
    - name: card_corner_radius
      label: Card rounding (px)
      type: number
      options:
        min: 0
        max: 60
    - name: header_sticky
      label: Sticky navigation
      type: boolean
    - name: smooth_scrolling
      label: Smooth anchor scrolling
      type: boolean
    - name: hero_image_radius
      label: Hero artwork corner rounding (px)
      type: number
      options:
        min: 0
        max: 65
    - name: hero_image_width
      label: Hero width — choose FULL for edge-to-edge
      type: select
      description: Full removes the side margins, independently of image fit.
      options:
        values:
        - full
        - contained
    - name: hero_image_display
      label: Hero image fit
      type: select
      description: Natural shows the whole banner. Cover crops to fill the chosen height.
      options:
        values:
        - natural
        - cover
    - name: hero_height_mode
      label: Hero height mode
      type: select
      description: Image keeps original banner proportions. Screen uses the viewport-height percentage below.
      options:
        values:
        - image
        - screen
    - name: hero_height_screen_percentage
      label: Hero height as percent of screen (screen mode)
      type: number
      options:
        min: 40
        max: 100
    - name: hero_image_position
      label: Hero image focal position
      type: select
      options:
        values:
        - center
        - left
        - right
    - name: hero_mobile_image_display
      label: Hero image fit on mobile
      type: select
      description: Natural avoids cropping lettering and people. Cover fills a set-height mobile banner.
      options:
        values:
        - natural
        - cover
    - name: hero_mobile_cover_height
      label: Mobile cover height (px)
      type: number
      options:
        min: 180
        max: 650
    - name: story_image_style
      label: Our Story photo filter
      type: select
      options:
        values:
        - grayscale
        - color
        - sepia
    - name: story_photo_position
      label: Our Story photo side
      type: select
      options:
        values:
        - left
        - right
    - name: pillars_columns_desktop
      label: Our Heart cards — desktop columns
      type: number
      options:
        min: 1
        max: 3
    - name: mission_columns_desktop
      label: Our Mission cards — desktop columns
      type: number
      options:
        min: 1
        max: 3
    - name: show_announcement_bar
      label: Show top announcement bar
      type: boolean
    - name: outer_gutter_desktop
      label: Content left/right gutter on desktop (px)
      type: number
      options:
        min: 16
        max: 110
    - name: outer_gutter_mobile
      label: Content left/right gutter on mobile (px)
      type: number
      options:
        min: 8
        max: 48
    - name: header_height_desktop
      label: Header height — desktop (px)
      type: number
      options:
        min: 56
        max: 140
    - name: header_height_mobile
      label: Header height — mobile (px)
      type: number
      options:
        min: 48
        max: 110
    - name: header_logo_width_desktop
      label: Header monogram width — desktop (px)
      type: number
      options:
        min: 24
        max: 100
    - name: header_logo_width_mobile
      label: Header monogram width — mobile (px)
      type: number
      options:
        min: 20
        max: 90
    - name: menu_gap_desktop
      label: Space between desktop menu items (px)
      type: number
      options:
        min: 12
        max: 75
    - name: announcement_height
      label: Announcement bar height (px)
      type: number
      options:
        min: 22
        max: 70
    - name: hero_space_above
      label: Space above hero artwork (px)
      type: number
      options:
        min: 0
        max: 90
    - name: hero_space_below
      label: Space below hero artwork (px)
      type: number
      options:
        min: 0
        max: 130
    - name: hero_cover_height_desktop
      label: Hero Cover image height — desktop (px)
      type: number
      options:
        min: 260
        max: 1300
    - name: hero_max_height_desktop
      label: Maximum hero image height — desktop (px)
      type: number
      options:
        min: 260
        max: 1700
    - name: hero_mobile_image_width_percent
      label: Mobile hero image width (%)
      type: number
      options:
        min: 60
        max: 120
    - name: hero_mobile_image_position
      label: Mobile hero focal position (%)
      type: number
      options:
        min: 0
        max: 100
    - name: hero_mobile_side_padding
      label: Mobile hero side padding (px)
      type: number
      options:
        min: 0
        max: 60
    - name: story_image_height_desktop
      label: Our Story photograph height — desktop (px)
      type: number
      options:
        min: 280
        max: 1100
    - name: story_image_height_mobile
      label: Our Story photograph height — mobile (px)
      type: number
      options:
        min: 220
        max: 850
    - name: story_image_fit
      label: Our Story image crop
      type: select
      description: Cover fills the frame; contain preserves the full portrait.
      options:
        values:
        - cover
        - contain
    - name: card_gap
      label: Space between mission cards (px)
      type: number
      options:
        min: 0
        max: 55
    - name: card_padding
      label: Inside mission and pillar cards (px)
      type: number
      options:
        min: 10
        max: 70
    - name: belief_grid_gap
      label: Gap between belief preview tiles (px)
      type: number
      options:
        min: 0
        max: 30
    - name: section_outline_width
      label: Outline headline stroke width (tenths of px)
      type: number
      options:
        min: 5
        max: 40
    - name: show_story_image_caption
      label: Show label across story photo
      type: boolean
    - name: show_header_cta
      label: Show Get Connected button in header
      type: boolean
    - name: show_hero_secondary_button
      label: Show What We Believe text link in hero
      type: boolean
    - name: use_full_bleed_hero_mobile
      label: Force phone hero edge-to-edge
      type: boolean
      description: Recommended on. Your source artwork already contains the full composition.
  - name: effects
    label: 04 • Fine details — borders, animation & image appearance
    type: object
    fields:
    - name: card_border_style
      label: Card border style
      type: select
      options:
        values:
        - solid
        - none
        - dashed
    - name: card_border_color
      label: Card border color
      type: string
      description: 'Enter a hex color, such as #FFFFFF. Leave blank to use the default.'
      pattern:
        regex: ^$|^#(?:[A-Fa-f0-9]{3}|[A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$
        message: 'Use a hex color such as #FFFFFF, or leave this blank.'
    - name: card_border_width
      label: Card border width (px)
      type: number
      options:
        min: 0
        max: 5
    - name: image_treatment
      label: Global image color treatment
      type: select
      options:
        values:
        - original
        - grayscale
        - sepia
    - name: button_border_width
      label: Button border width (px)
      type: number
      options:
        min: 0
        max: 5
    - name: button_hover_effect
      label: Buttons hover behavior
      type: select
      options:
        values:
        - lift
        - none
        - darken
    - name: enable_animations
      label: Allow transitions and motion
      type: boolean
    - name: show_back_to_top
      label: Show footer Back to top link
      type: boolean
    - name: show_navigation_active_line
      label: Underline active menu item
      type: boolean
    - name: content_alignment
      label: Overall website content alignment
      type: select
      description: Does not affect full-width hero image.
      options:
        values:
        - center
        - left
  - name: sections
    label: 05 • Individual section design — edit each block independently
    type: object
    fields:
    - name: hero
      label: Hero / opening banner
      type: object
      fields:
      - name: visible
        label: Show this section
        type: boolean
      - name: background_color
        label: Background color
        type: string
        description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
      - name: background_image
        label: Optional background photo
        type: image
      - name: image_opacity
        label: Photo visibility (% — 0 to 100)
        type: number
        options:
          min: 0
          max: 100
      - name: image_position
        label: Photo alignment
        type: select
        options:
          values:
          - center
          - top
          - bottom
          - left
          - right
      - name: order
        label: Position on page (1 first; homepage only)
        type: number
        options:
          min: 1
          max: 15
      - name: text_color
        label: Section-specific heading & paragraph color
        type: string
        description: Overrides standard heading and paragraph colors for this section.
        pattern:
          regex: ^$|^#(?:[A-Fa-f0-9]{3}|[A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$
          message: 'Use a hex color such as #FFFFFF, or leave this blank.'
      - name: overlay_color
        label: Color overlay over photo
        type: string
        description: Used only if this section has a background image. Helpful for keeping text readable.
        pattern:
          regex: ^$|^#(?:[A-Fa-f0-9]{3}|[A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$
          message: 'Use a hex color such as #FFFFFF, or leave this blank.'
      - name: overlay_opacity
        label: Overlay strength (%)
        type: number
        options:
          min: 0
          max: 100
      - name: background_fit
        label: Background photo sizing
        type: select
        options:
          values:
          - cover
          - contain
          - auto
      - name: background_repeat
        label: Background photo repeat
        type: select
        options:
          values:
          - no-repeat
          - repeat
      - name: padding_top_desktop
        label: Top padding — desktop (px)
        type: number
        options:
          min: 0
          max: 220
      - name: padding_bottom_desktop
        label: Bottom padding — desktop (px)
        type: number
        options:
          min: 0
          max: 220
      - name: padding_top_mobile
        label: Top padding — mobile (px)
        type: number
        options:
          min: 0
          max: 160
      - name: padding_bottom_mobile
        label: Bottom padding — mobile (px)
        type: number
        options:
          min: 0
          max: 160
      - name: heading_alignment
        label: Heading alignment
        type: select
        options:
          values:
          - inherit
          - left
          - center
          - right
      - name: section_corner_radius
        label: Section corner rounding (px)
        type: number
        options:
          min: 0
          max: 80
      - name: show_divider_after
        label: Add a divider under section
        type: boolean
      description: This section can be shown/hidden, reordered, or given its own background, text color, background
        image, spacing and alignment.
    - name: ticker
