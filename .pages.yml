# Rise City Pages CMS — edit at https://app.pagescms.org/
media:
  input: assets
  output: /assets
content:
- name: appearance
  label: 01 — APPEARANCE & LAYOUT
  type: file
  path: content/appearance.json
  format: json
  fields:
  - name: palette
    label: 01 — Global colors
    type: object
    fields:
    - name: page_background
      label: Page background
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: body_text
      label: Main text
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: muted_text
      label: Paragraph / secondary text
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: card_background
      label: Cards / surfaces
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: alternate_background
      label: Alternating section background
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: divider
      label: Borders / dividers
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: header_background
      label: Navigation bar
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: header_text
      label: Navigation text
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: announcement_background
      label: Top announcement background
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: announcement_text
      label: Top announcement text
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: accent
      label: Line / rule accents
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: outline_text
      label: Outlined heading text
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: button_background
      label: Dark button background
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: button_text
      label: Dark button text
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: light_button_background
      label: Light button background
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: light_button_text
      label: Light button text
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: dark_background
      label: Dark section background
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: dark_text
      label: Dark section text
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
    - name: footer_background
      label: Footer background
      type: string
      description: 'Hex color, e.g. #F5F5F5 (a picker is not built into Pages CMS).'
  - name: typography
    label: 02 — Fonts & text sizes
    type: object
    fields:
    - name: headings_font
