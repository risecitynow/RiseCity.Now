- name: homepage
  label: 02 — HOMEPAGE TEXT
  type: file
  path: content/home.json
  format: json
  fields:
  - name: hero
    label: Opening message
    type: object
    fields:
    - name: title_first
      label: Big hero headline / line 1
      type: string
    - name: title_second
      label: Big hero headline / outlined line
      type: string
    - name: verse
      label: Acts 3:6 quotation
      type: text
    - name: invitation
      label: Invitation
      type: text
  - name: headings
    label: Every large section heading
    type: object
    fields:
    - name: message_line1
      label: Meaning heading / first line
      type: string
    - name: message_outline
      label: Meaning / outlined line
      type: string
    - name: message_line3
      label: Meaning / line 3
      type: string
    - name: message_line4
      label: Meaning / line 4
      type: string
    - name: story_line1
      label: Story / heading line 1
      type: string
    - name: story_line2
      label: Story / heading line 2
      type: string
    - name: story_outline
      label: Story / outlined word
      type: string
    - name: heart_line1
      label: Our Heart / first line
      type: string
    - name: heart_outline
      label: Our Heart / outlined line
      type: string
    - name: belief_line1
      label: Beliefs preview / first line
      type: string
    - name: belief_outline
      label: Beliefs preview / outlined line
      type: string
    - name: foundation_line1
      label: Foundation / first line
      type: string
    - name: foundation_line2
      label: Foundation / second line
      type: string
    - name: foundation_outline
      label: Foundation / outlined line
      type: string
    - name: mission_line1
      label: Our Mission / first line
      type: string
    - name: mission_outline
      label: Our Mission / outlined words
      type: string
    - name: mission_line2
      label: Our Mission / ending words
      type: string
    - name: connect_line1
      label: Connect / line 1
      type: string
    - name: connect_line2
      label: Connect / line 2
      type: string
    - name: connect_line3
      label: Connect / line 3
      type: string
  - name: message
    label: Rise Up and Walk — meaning
    type: object
    fields:
    - name: scripture_quote
      label: Scripture quotation
      type: text
    - name: lead
      label: Opening statement
      type: text
    - name: paragraph_one
      label: The story in Acts 3
      type: text
    - name: paragraph_two
      label: Rise City invitation
      type: text
    - name: paragraph_three
      label: Walking and sharing
      type: text
    - name: steps
      label: Three responses — Rise, Walk, Go
      type: object
      fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: text
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
  - name: story
    label: Our story
    type: object
    fields:
    - name: lead
      label: Opening statement
      type: text
    - name: paragraph_one
      label: About Rise City
      type: text
    - name: paragraph_two
      label: Our hope
      type: text
    - name: footer_line1
      label: Small closing line
      type: string
    - name: footer_line2
      label: Bold closing line
      type: string
  - name: heart
    label: Our heart
    type: object
    fields:
    - name: introduction
      label: Introduction
      type: text
    - name: pillars
      label: Three pillars
      type: object
      fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: text
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
  - name: belief_preview
    label: Beliefs summary on homepage
    type: object
    fields:
    - name: lead
      label: Short tagline
      type: text
    - name: introduction
      label: Introduction
      type: text
  - name: foundation
    label: Our foundation
    type: object
    fields:
    - name: introduction
      label: Statement
      type: text
    - name: verse
      label: Ephesians 4 quotation
      type: text
    - name: verse_reference
      label: Verse reference
      type: string
  - name: mission
    label: Citywide mission
    type: object
    fields:
    - name: introduction
      label: Introduction
      type: text
    - name: cards
      label: Three mission points
      type: object
      fields:
      - name: title
        label: Title
